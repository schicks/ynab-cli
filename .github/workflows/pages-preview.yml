name: Deploy hypotheticals PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - "packages/hypotheticals/**"
      - ".github/workflows/pages-preview.yml"

# Shared with pages-deploy.yml so a production deploy and a PR preview
# deploy never race to push the gh-pages branch at the same time.
concurrency:
  group: gh-pages-branch
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22
        if: github.event.action != 'closed'

      - run: nix develop --command bun install --frozen-lockfile
        if: github.event.action != 'closed'

      - run: >-
          nix develop --command
          bun run --cwd packages/hypotheticals build --
          --base=/ynab-cli/pr-preview/pr-${{ github.event.number }}/
        if: github.event.action != 'closed'

      # Copies packages/hypotheticals/dist into pr-preview/pr-<number>/ on
      # the gh-pages branch and comments the preview link on the PR; on a
      # 'closed' event it instead removes that PR's preview folder.
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: packages/hypotheticals/dist
